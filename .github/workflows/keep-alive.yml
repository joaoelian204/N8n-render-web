name: Keep Supabase Alive

on:
  schedule:
    # Se ejecuta cada 5 minutos para mantener la base de datos activa
    - cron: '*/5 * * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub

jobs:
  ping_database:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase API
        run: |
          # Realizamos una consulta simple a la raíz de la API de Supabase.
          # Esto genera la actividad necesaria en la base de datos sin requerir una tabla específica.
          curl -f -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/" \
          -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}" \
          -H "User-Agent: GitHubAction-KeepAlive"
